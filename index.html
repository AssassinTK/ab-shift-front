<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>A Beach 外場 11 月班表</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#f5f4f0; --card:#fff; --fg:#1f2421; --muted:#6b726e; --line:#e2e0d9; --soft:#efeee9;
  --accent:#0f6b5c; --accent-soft:#dcefea;
  --duty-bg:#ffe1c7; --duty-fg:#8a3c00;
  --bar-bg:#d7e8fb; --bar-fg:#1f4f85;
  --close-bg:#e9defe; --close-fg:#4b2a99;
  --srv-bg:#fff; --srv-fg:#1f2421;
  --off-bg:#3a3f3c; --off-fg:#f2f2f0;
  --idle-bg:#f0efea; --idle-fg:#9aa09c;
  --red:#c0392b; --red-soft:#fde3df; --amber:#9a6a00; --amber-soft:#fff2c9; --blue:#2a64b0; --green:#1f8a3b;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121514; --card:#1b1f1d; --fg:#e8ece9; --muted:#9aa49f; --line:#2e3532; --soft:#232826;
  --accent:#5fc9b4; --accent-soft:#18332d;
  --duty-bg:#5a3112; --duty-fg:#ffd2ad; --bar-bg:#163353; --bar-fg:#b5d4f7;
  --close-bg:#33265a; --close-fg:#dccbff; --srv-bg:#1b1f1d; --srv-fg:#e8ece9;
  --off-bg:#000; --off-fg:#c9cdca; --idle-bg:#202523; --idle-fg:#6c7470;
  --red:#ff8a7a; --red-soft:#4a1f1a; --amber:#f2c14e; --amber-soft:#3d3214; --blue:#8bb8f0; --green:#5fd17e;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121514; --card:#1b1f1d; --fg:#e8ece9; --muted:#9aa49f; --line:#2e3532; --soft:#232826;
  --accent:#5fc9b4; --accent-soft:#18332d;
  --duty-bg:#5a3112; --duty-fg:#ffd2ad; --bar-bg:#163353; --bar-fg:#b5d4f7;
  --close-bg:#33265a; --close-fg:#dccbff; --srv-bg:#1b1f1d; --srv-fg:#e8ece9;
  --off-bg:#000; --off-fg:#c9cdca; --idle-bg:#202523; --idle-fg:#6c7470;
  --red:#ff8a7a; --red-soft:#4a1f1a; --amber:#f2c14e; --amber-soft:#3d3214; --blue:#8bb8f0; --green:#5fd17e;
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 48px}
header.top{padding:20px 0 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:1.35rem;font-weight:900;margin:0;letter-spacing:.02em}
.meta{color:var(--muted);font-size:13px;margin:4px 0 0}
.thm{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;padding:10px 0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 10px}
.pill-row button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 10px;font:inherit;font-size:14px;cursor:pointer}
.pill-row button[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.pill-row .lbl{font-size:12px;color:var(--muted);align-self:center;margin-right:2px}
section[hidden]{display:none}
.hint{color:var(--muted);font-size:13px;margin:6px 0 12px}

/* 每日 */
.days{display:grid;gap:12px}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.day.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.day-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 14px 8px;flex-wrap:wrap}
.day-h .d{font-size:1.15rem;font-weight:900}
.day-h .d small{font-size:.85rem;color:var(--muted);font-weight:500;margin-left:4px}
.tag-today{background:var(--accent);color:var(--bg);border-radius:6px;font-size:11px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.stats{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.stat{background:var(--soft);border-radius:6px;padding:2px 8px;white-space:nowrap}
.stat b{font-weight:700}
.stat.big{background:var(--amber-soft);color:var(--amber)}
.stat.warn{background:var(--red-soft);color:var(--red);font-weight:700}
.stat.lack1,.stat.lack2{background:var(--red-soft);color:var(--red)}
.stat.more,.stat.more2{background:var(--amber-soft);color:var(--amber)}
.grp{display:grid;grid-template-columns:4.6em 1fr;gap:4px 10px;padding:8px 14px;border-top:1px solid var(--line);align-items:start}
.grp .k{font-size:13px;font-weight:700;color:var(--muted);padding-top:3px}
.grp .k small{display:block;font-weight:500;font-size:11px}
.ppl{display:flex;flex-wrap:wrap;gap:6px}
.p{display:inline-flex;align-items:baseline;gap:5px;border-radius:7px;padding:3px 8px;font-size:14px;font-weight:700;background:var(--soft)}
.p small{font-weight:500;font-size:12px;opacity:.8}
.p.duty{background:var(--duty-bg);color:var(--duty-fg)}
.p.bar{background:var(--bar-bg);color:var(--bar-fg)}
.p.close{background:var(--close-bg);color:var(--close-fg)}
.p.srv{background:var(--soft);color:var(--fg)}
.p.off{background:transparent;border:1px dashed var(--line);color:var(--muted);font-weight:500}
.p.idle{background:transparent;color:var(--muted);font-weight:500;border:1px solid var(--line)}
.sw{position:relative}
.sw::after{content:"調";font-size:10px;font-weight:700;color:var(--blue);margin-left:2px}
.grp.offg{background:var(--soft)}
.grp.offg .p.off{background:var(--card)}

/* 個人 */
.who{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.who h2{margin:0;font-size:1.2rem}
.who h2 small{font-size:.85rem;color:var(--muted);font-weight:500;margin-left:6px}
.kpis{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.kpi{background:var(--soft);border-radius:10px;padding:6px 12px}
.kpi b{font-size:1.15rem;display:block;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wh{font-size:12px;color:var(--muted);text-align:center;font-weight:700;padding:2px 0}
.cal .wkl{grid-column:1/-1;font-size:12px;color:var(--muted);margin:8px 0 0;font-weight:700}
.cc{border-radius:8px;padding:5px 4px 6px;min-height:64px;font-size:12px;line-height:1.3;text-align:center;border:1px solid var(--line);background:var(--srv-bg);display:flex;flex-direction:column;gap:2px;align-items:center}
.cc .dt{font-size:11px;color:var(--muted);font-weight:500}
.cc .r{font-weight:900;font-size:12px}
.cc .t{font-variant-numeric:tabular-nums;font-weight:700}
.cc.duty{background:var(--duty-bg);color:var(--duty-fg);border-color:transparent}
.cc.bar{background:var(--bar-bg);color:var(--bar-fg);border-color:transparent}
.cc.close{background:var(--close-bg);color:var(--close-fg);border-color:transparent}
.cc.off{background:var(--off-bg);color:var(--off-fg);border-color:transparent}
.cc.idle{background:var(--idle-bg);color:var(--idle-fg);border-color:transparent}
.cc.duty .dt,.cc.bar .dt,.cc.close .dt,.cc.off .dt{color:inherit;opacity:.75}
.cc.today{outline:2px solid var(--accent);outline-offset:1px}
.cc .swt{font-size:10px;font-weight:700;color:var(--blue)}
.cc.off .swt{color:#9cc3ff}
.cc .why{font-size:11px;opacity:.85}

/* 表格 */
.tbl-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}
th{font-weight:700;color:var(--muted);font-size:12px}
th small{display:block;font-weight:500}
td.k,th.k{text-align:left;position:sticky;left:0;background:var(--card);font-weight:700;color:var(--fg);padding-left:12px}
tr.sep td{border-top:2px solid var(--line)}
.n{font-weight:700;font-size:14px}
.n small{font-weight:500;color:var(--muted);font-size:11px;margin-left:2px}
td.lack1,td.lack2{background:var(--red-soft);color:var(--red)}
td.more,td.more2{background:var(--amber-soft);color:var(--amber)}
td.heat1,td.heat2,td.heat3{box-shadow:inset 0 0 0 2px var(--red)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:10px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}

/* 假期 */
.hcards{display:grid;gap:12px}
.hc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.hc h3{margin:0 0 4px;font-size:1.05rem}
.hc .sub{color:var(--muted);font-size:12px;margin:0 0 10px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.hd{border-radius:8px;padding:5px 7px;font-size:12px;background:var(--soft)}
.hd b{display:block;font-size:11px;color:var(--muted);font-weight:500}
.hd.hon{color:var(--green)}
.hd.hmv{color:var(--amber)}
.hd.hpl{color:var(--blue);text-decoration:underline;font-weight:700}
.hd.hx{color:var(--red);font-weight:700}
.hd.hna{color:var(--idle-fg)}

/* 週模組 */
.mods{display:grid;gap:10px}
.md{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.md h3{margin:0;font-size:1rem}
.md h3 small{color:var(--muted);font-weight:500;margin-left:6px;font-size:12px}
.md .need{font-size:13px;margin:4px 0 8px;color:var(--fg)}
.md .need:empty,.md .need.none{color:var(--muted)}
.md .cal .cc{min-height:46px}
.md .foot{font-size:12px;color:var(--muted);margin-top:6px}
.sec-h{font-size:1.05rem;margin:18px 0 6px}
footer{color:var(--muted);font-size:12px;margin-top:28px}
footer a{color:inherit}
@media (min-width:720px){
  .days{grid-template-columns:1fr 1fr}
  .cc{min-height:72px;font-size:13px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>A Beach 外場 11 月班表</h1>
      <p class="meta" id="meta"></p>
    </div>
    <button class="thm" id="thm" type="button">切深色</button>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="day">每日誰上班</button>
    <button role="tab" data-tab="me">個人班表</button>
    <button role="tab" data-tab="cov">人力對照</button>
    <button role="tab" data-tab="hol">國定假日／特休</button>
    <button role="tab" data-tab="mod">週模組</button>
  </nav>

  <section id="tab-day">
    <div class="pill-row" id="wk-day"></div>
    <p class="hint">橘＝Duty（開早 11–22）、藍＝Bar（吧檯）、紫＝收（收班）；「調」＝這格是調班後的結果。全店 17–18 休息，1830＝18:30。</p>
    <div class="days" id="days"></div>
  </section>

  <section id="tab-me" hidden>
    <div class="pill-row" id="ppl"></div>
    <div id="me"></div>
  </section>

  <section id="tab-cov" hidden>
    <div class="pill-row" id="wk-cov"></div>
    <p class="hint">大字＝實際排的人數，小字＝週模組人數。紅底＝比模組少，黃底＝比模組多；紅框＝照訂位算還缺人（1 人顧 15 位客，每組訂位算 2 小時）。</p>
    <div class="tbl-wrap"><table id="cov"></table></div>
  </section>

  <section id="tab-hol" hidden>
    <p class="hint">2026 年 16 天國定假日每人放在哪天。<span style="color:var(--green)">綠＝當天放</span>、<span style="color:var(--amber)">黃＝挪到別天放</span>、<span style="color:var(--blue);text-decoration:underline">藍＝已排進 11 月班表</span>、<span style="color:var(--red)">X＝還沒放</span>、—＝那時還沒到職。</p>
    <div class="hcards" id="hol"></div>
  </section>

  <section id="tab-mod" hidden>
    <p class="hint">每個人的「標準一週」和排休需求。四週班表就是從這個模組排出來、再依請假和調班微調。</p>
    <div class="mods" id="mod"></div>
  </section>

  <footer id="foot"></footer>
</div>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
};

const now = new Date();
const todayMd = (now.getMonth()+1) + '/' + now.getDate();
const todayIdx = DATA.dates.findIndex(d => d.md === todayMd);
const WEEKS = [0,1,2,3];
const weekOfIdx = i => Math.floor(i/7);

function info(d){
  const swap = d.swap;
  if (d.kind === 'duty' || d.kind === 'bar' || d.kind === 'close')
    return { cls: d.kind, role: d.role, time: d.time, work: true, swap };
  if (d.kind === 'srv')
    return { cls: 'srv', role: '', am: d.am, pm: d.pm, work: true, swap };
  if (d.kind === 'hol')
    return { cls: 'off', role: d.role, why: '國定假日', off: true, swap };
  if (d.rl.length || d.req.length)
    return { cls: 'off', role: d.rl.join(' ') || '休', why: d.req.join('、'), off: true, swap };
  if (swap === '調班休')
    return { cls: 'off', role: '休', why: '', off: true, swap };
  return { cls: 'idle', role: d.x ? 'X' : '', why: d.x ? '不能上' : '可支援', x: d.x, swap };
}
const label = d => d.nick && d.nick !== d.name ? d.nick : d.name;

function weekButtons(el, key, onPick){
  const saved = +store.get(key);
  let cur = Number.isInteger(saved) && saved >= 0 && saved < 4 && store.get(key) !== null ? saved : (todayIdx >= 0 ? weekOfIdx(todayIdx) : 0);
  const render = () => {
    el.innerHTML = '<span class="lbl">週次</span>' + WEEKS.map(w => {
      const a = DATA.dates[w*7].md, b = DATA.dates[w*7+6].md;
      return `<button type="button" aria-pressed="${w===cur}" data-w="${w}">第 ${w+1} 週 <small>${a}–${b}</small></button>`;
    }).join('');
  };
  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    cur = +b.dataset.w; store.set(key, cur); render(); onPick(cur);
  });
  render(); onPick(cur);
}

function sumAt(name, i){ return (DATA.sums[name] || [])[i] || {}; }

function renderDays(w){
  const out = [];
  for (let i = w*7; i < w*7+7; i++){
    const dt = DATA.dates[i];
    const g = { duty:[], bar:[], close:[], am:[], pm:[], off:[], idle:[] };
    DATA.staff.forEach(s => {
      const d = info(s.days[i]);
      const nm = label(s);
      const sw = d.swap ? ' sw' : '';
      if (d.cls === 'duty' || d.cls === 'bar' || d.cls === 'close') g[d.cls].push(`<span class="p ${d.cls}${sw}">${esc(nm)}<small>${esc(d.time)}</small></span>`);
      else if (d.cls === 'srv'){
        if (d.am) g.am.push([d.am, `<span class="p srv${sw}">${esc(nm)}<small>${esc(d.am)}</small></span>`]);
        if (d.pm) g.pm.push([d.pm, `<span class="p srv${sw}">${esc(nm)}<small>${esc(d.pm)}</small></span>`]);
      }
      else if (d.off) g.off.push(`<span class="p off${sw}">${esc(nm)}<small>${esc(d.role)}${d.why ? '・'+esc(d.why) : ''}</small></span>`);
      else if (!d.x) g.idle.push(`<span class="p idle">${esc(nm)}</span>`);
    });
    const byStart = a => a.sort((x,y) => parseFloat(x[0]) - parseFloat(y[0])).map(x => x[1]);
    const hc = sumAt('人數', i), hr = sumAt('時數', i), rl = sumAt('訂位 午', i), rd = sumAt('訂位 晚', i), bg = sumAt('大訂', i), ok = sumAt('人力夠嗎', i);
    const stats = [
      hc.ac ? `<span class="stat ${esc(hc.acCls)}">上班 <b>${esc(hc.ac)}</b> 人${hc.nd && hc.nd !== hc.ac ? `（模組 ${esc(hc.nd)}）` : ''}</span>` : '',
      hr.text ? `<span class="stat">${esc(hr.text)} 小時</span>` : '',
      (rl.text || rd.text) ? `<span class="stat">訂位 午 <b>${esc(rl.text || 0)}</b>／晚 <b>${esc(rd.text || 0)}</b></span>` : '',
      bg.text ? `<span class="stat big">大訂 ${esc(bg.text)}</span>` : '',
      ok.text && ok.text !== '✓' ? `<span class="stat warn">${esc(ok.text)}</span>` : '',
    ].join('');
    const row = (k, sub, arr, cls='') => arr.length ? `<div class="grp ${cls}"><div class="k">${k}${sub ? `<small>${sub}</small>` : ''}</div><div class="ppl">${arr.join('')}</div></div>` : '';
    out.push(`<article class="day${i===todayIdx ? ' today' : ''}">
      <div class="day-h"><div class="d">${esc(dt.md)}<small>週${esc(dt.wd)}</small>${i===todayIdx ? '<span class="tag-today">今天</span>' : ''}</div><div class="stats">${stats}</div></div>
      ${row('Duty', '開早', g.duty)}${row('Bar', '吧檯', g.bar)}${row('收', '收班', g.close)}
      ${row('午班', 'Server', byStart(g.am))}${row('晚班', 'Server', byStart(g.pm))}
      ${row('休假', '', g.off, 'offg')}${row('可支援', '沒排但能問', g.idle, 'offg')}
    </article>`);
  }
  $('#days').innerHTML = out.join('');
}

/* 個人班表 */
function cellHtml(d, md, isToday){
  const f = info(d);
  let body = '';
  if (f.cls === 'srv') body = `<span class="t">${esc(f.am || '—')}</span><span class="t">${esc(f.pm || '—')}</span>`;
  else if (f.work) body = `<span class="r">${esc(f.role)}</span><span class="t">${esc(f.time)}</span>`;
  else if (f.off) body = `<span class="r">${esc(f.role)}</span>${f.why ? `<span class="why">${esc(f.why)}</span>` : ''}`;
  else body = `<span class="why">${esc(f.x ? 'X' : '')}</span>`;
  const sw = f.swap ? `<span class="swt">${esc(f.swap)}</span>` : '';
  return `<div class="cc ${f.cls}${isToday ? ' today' : ''}">${md ? `<span class="dt">${esc(md)}</span>` : ''}${body}${sw}</div>`;
}
function renderMe(idx){
  const s = DATA.staff[idx];
  const m = s.hours.match(/([\d.]+)\s*模組\s*([\d.]+)/) || [];
  const workDays = s.days.filter(d => info(d).work).length;
  const offDays = s.days.filter(d => info(d).off).length;
  const swaps = s.days.filter(d => d.swap).length;
  const head = ['一','二','三','四','五','六','日'].map(x => `<div class="wh">${x}</div>`).join('');
  let cal = '';
  for (const w of WEEKS){
    cal += `<div class="wkl">第 ${w+1} 週</div>` + head;
    for (let i = w*7; i < w*7+7; i++) cal += cellHtml(s.days[i], DATA.dates[i].md, i === todayIdx);
  }
  $('#me').innerHTML = `<div class="who">
      <h2>${esc(s.name)}<small>${esc(s.nick)}${s.pt ? ' · PT' : ' · 正職'}</small></h2>
      <div class="kpis">
        <div class="kpi"><b>${esc(m[1] || '—')}</b><span>四週時數</span></div>
        <div class="kpi"><b>${esc(m[2] || '—')}</b><span>模組時數</span></div>
        <div class="kpi"><b>${workDays}</b><span>上班天數</span></div>
        <div class="kpi"><b>${offDays}</b><span>休假天數</span></div>
        ${swaps ? `<div class="kpi"><b>${swaps}</b><span>調班格</span></div>` : ''}
      </div>
    </div>
    <div class="cal">${cal}</div>
    <p class="hint">兩行時間＝上行午班、下行晚班，—＝那段沒上。灰格＝沒排班（空白可以問支援，X＝絕對不能上）。</p>`;
}
function initPeople(){
  const el = $('#ppl');
  const saved = store.get('ab-front-me');
  let cur = saved !== null && DATA.staff[+saved] ? +saved : 0;
  const render = () => {
    const btn = (s, i) => `<button type="button" aria-pressed="${i===cur}" data-i="${i}">${esc(label(s))}</button>`;
    el.innerHTML = '<span class="lbl">正職</span>' + DATA.staff.map((s,i) => s.pt ? '' : btn(s,i)).join('')
      + '<span class="lbl" style="margin-left:8px">PT</span>' + DATA.staff.map((s,i) => s.pt ? btn(s,i) : '').join('');
  };
  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    cur = +b.dataset.i; store.set('ab-front-me', cur); render(); renderMe(cur);
  });
  render(); renderMe(cur);
}

/* 人力對照 */
const COV_ROWS = [
  ['人數', 'pair'], ['正職', 'pair'], ['PT', 'pair'], ['時數', 'text'],
  ['11–12 開班', 'pair', true], ['12–12:30 午餐', 'pair'], ['12:30–15 午餐', 'pair'], ['15–16 下午', 'pair'], ['16–17 下午', 'pair'],
  ['18–18:30 晚餐', 'pair'], ['18:30–21 晚餐', 'pair'], ['21–21:30 收尾', 'pair'], ['21:30–22 收尾', 'pair'], ['22–23 收班', 'pair'],
  ['訂位 午', 'text', true], ['訂位 晚', 'text'], ['大訂', 'text'], ['人力夠嗎', 'text'],
];
function renderCov(w){
  const idx = [...Array(7)].map((_, k) => w*7+k);
  let h = '<thead><tr><th class="k">時段</th>' + idx.map(i => `<th${i===todayIdx ? ' style="color:var(--accent)"' : ''}>${esc(DATA.dates[i].md)}<small>${esc(DATA.dates[i].wd)}</small></th>`).join('') + '</tr></thead><tbody>';
  for (const [name, type, sep] of COV_ROWS){
    if (!DATA.sums[name]) continue;
    h += `<tr${sep ? ' class="sep"' : ''}><td class="k">${esc(name)}</td>`;
    for (const i of idx){
      const c = sumAt(name, i);
      if (type === 'pair' && c.ac){
        const cls = [c.acCls, c.heat].filter(Boolean).join(' ');
        h += `<td class="${esc(cls)}"><span class="n">${esc(c.ac)}<small>${c.nd !== c.ac ? '/' + esc(c.nd) : ''}</small></span></td>`;
      } else {
        const t = c.text === '–' ? '' : c.text;
        const warn = name === '人力夠嗎' && t && t !== '✓';
        h += `<td${warn ? ' class="lack1"' : ''} style="white-space:${name === '大訂' ? 'normal' : 'nowrap'};font-size:${name === '大訂' ? '11px' : ''}">${esc(t)}</td>`;
      }
    }
    h += '</tr>';
  }
  $('#cov').innerHTML = h + '</tbody>';
}

/* 國定假日／特休 */
function renderHol(){
  const head = DATA.hol.head;
  $('#hol').innerHTML = DATA.hol.rows.map(r => {
    const c = r.cells;
    const days = c.slice(0, 16).map((x, k) => `<div class="hd ${esc(x.cls)}"><b>${esc(head[k][1])} ${esc(head[k][2])}</b>${esc(x.text)}</div>`).join('');
    const s = DATA.staff.find(s => s.name === r.name);
    return `<article class="hc">
      <h3>${esc(r.name)}${s ? `<small style="color:var(--muted);font-weight:500;margin-left:6px">${esc(s.nick)}</small>` : ''}</h3>
      <p class="sub">${esc(c[17].text)}（${esc(c[17].sub)}）</p>
      <div class="kpis" style="margin:0 0 10px">
        <div class="kpi"><b>${esc(c[16].text)}</b><span>國定未放</span></div>
        <div class="kpi"><b>${esc(c[18].text)}</b><span>特休剩餘${c[18].sub ? '・' + esc(c[18].sub) : ''}</span></div>
        <div class="kpi"><b>${esc(c[19].text)}</b><span>特休到期</span></div>
      </div>
      <div class="hgrid">${days}</div>
    </article>`;
  }).join('') + '<p class="hint">只有正職有國定假日與特休表；特休到期前 3 個月沒休完要結算工資。</p>';
}

/* 週模組 */
function renderMod(){
  const head = ['一','二','三','四','五','六','日'].map(x => `<div class="wh">${x}</div>`).join('');
  const rows = DATA.mod.filter(r => !r.total);
  const tot = DATA.mod.find(r => r.total);
  const card = r => `<article class="md">
      <h3>${esc(r.name)}<small>${esc(r.nick)}${r.pt ? ' · PT' : ' · 正職'}　每週 ${esc(r.dayCount)} 天、${esc(r.hours)} 小時</small></h3>
      <p class="need${r.need === '無' ? ' none' : ''}">${r.need === '無' ? '沒有特別排休需求' : esc(r.need)}</p>
      <div class="cal">${head}${r.days.map(d => cellHtml(d, '', false)).join('')}</div>
    </article>`;
  $('#mod').innerHTML = '<h2 class="sec-h">正職</h2>' + rows.filter(r => !r.pt).map(card).join('')
    + '<h2 class="sec-h">PT</h2>' + rows.filter(r => r.pt).map(card).join('')
    + (tot ? `<p class="hint">每天模組人數：一 ${tot.days[0]}、二 ${tot.days[1]}、三 ${tot.days[2]}、四 ${tot.days[3]}、五 ${tot.days[4]}、六 ${tot.days[5]}、日 ${tot.days[6]}；一週共 ${esc(tot.dayCount)} 人次、${esc(tot.hours)} 小時。</p>` : '');
}

/* 分頁、主題 */
function showTab(t){
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  document.querySelectorAll('section[id^="tab-"]').forEach(s => s.hidden = s.id !== 'tab-' + t);
  store.set('ab-front-tab', t);
}
document.querySelector('nav.tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) showTab(b.dataset.tab); });

function applyTheme(t){
  if (t) document.documentElement.setAttribute('data-theme', t);
  const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  $('#thm').textContent = dark ? '切淺色' : '切深色';
}
$('#thm').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  store.set('ab-theme', next); applyTheme(next);
});
applyTheme(store.get('ab-theme'));

const totH = (DATA.sums['時數'] || [])[28]?.text || '';
$('#meta').textContent = `${DATA.dates[0].md}（${DATA.dates[0].wd}）– ${DATA.dates[27].md}（${DATA.dates[27].wd}）四週・正職 ${DATA.staff.filter(s => !s.pt).length} 人、PT ${DATA.staff.filter(s => s.pt).length} 人${totH ? '・總時數 ' + totH : ''}`;
$('#foot').innerHTML = `資料擷取自 <a href="${esc(DATA.source)}">ab-shift 班表</a>（${esc(DATA.captured)}）。班表有異動以原始班表為準。`;

weekButtons($('#wk-day'), 'ab-front-wk', renderDays);
weekButtons($('#wk-cov'), 'ab-front-wk-cov', renderCov);
initPeople();
renderHol();
renderMod();
showTab(['day','me','cov','hol','mod'].includes(store.get('ab-front-tab')) ? store.get('ab-front-tab') : 'day');
</script>
</body>
</html>
